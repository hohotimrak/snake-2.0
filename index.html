<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Survival: Fantasy Quest</title>
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 50%, #1a472a 100%);
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            background: #2d5a3f;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            font-size: 18px;
            z-index: 10;
        }

        .hud div {
            margin-bottom: 5px;
            background: rgba(0, 50, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #4a7c59;
            display: inline-block;
        }

        .compass {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(0, 80, 0, 0.8) 0%, rgba(0, 40, 0, 0.9) 100%);
            border: 3px solid #6b8e5c;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 20px rgba(100, 180, 100, 0.5);
        }

        .compass-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 30px;
            background: linear-gradient(to top, #ff6b6b, #ffd93d);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            border-radius: 2px 2px 0 0;
            transition: transform 0.1s ease-out;
        }

        .compass-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: #ffd93d;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #fff;
        }

        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(20, 60, 30, 0.95) 0%, rgba(30, 80, 50, 0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        .menu-title {
            font-size: 48px;
            color: #ffd93d;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8), 0 0 20px rgba(255, 217, 61, 0.5);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .menu-subtitle {
            font-size: 20px;
            color: #90ee90;
            margin-bottom: 40px;
            text-align: center;
        }

        .menu-btn {
            background: linear-gradient(180deg, #4a7c59 0%, #2d5a3f 100%);
            color: #fff;
            border: 3px solid #6b8e5c;
            padding: 15px 40px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            min-width: 250px;
            text-align: center;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .menu-btn:hover {
            background: linear-gradient(180deg, #5a8c69 0%, #3d6a4f 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 180, 100, 0.6);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .upgrade-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 60, 30, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            pointer-events: auto;
        }

        .upgrade-title {
            font-size: 32px;
            color: #ffd93d;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .upgrade-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .upgrade-card {
            background: linear-gradient(180deg, #3a6c49 0%, #255035 100%);
            border: 3px solid #6b8e5c;
            border-radius: 15px;
            padding: 20px;
            width: 220px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .upgrade-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(100, 180, 100, 0.7);
            border-color: #ffd93d;
        }

        .upgrade-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
        }

        .upgrade-name {
            font-size: 18px;
            color: #ffd93d;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .upgrade-desc {
            font-size: 14px;
            color: #90ee90;
            text-align: center;
            line-height: 1.4;
        }

        .rarity-common { border-color: #888; }
        .rarity-rare { border-color: #4a90e2; box-shadow: 0 0 15px rgba(74, 144, 226, 0.5); }
        .rarity-epic { border-color: #a335ee; box-shadow: 0 0 15px rgba(163, 53, 238, 0.5); }
        .rarity-legendary { border-color: #ffd93d; box-shadow: 0 0 20px rgba(255, 217, 61, 0.7); }

        .pause-menu {
            display: none;
        }

        .stats-row {
            background: rgba(0, 50, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #4a7c59;
        }

        .stat-item {
            display: inline-block;
            margin: 0 15px;
            color: #fff;
            font-size: 16px;
        }

        .stat-label {
            color: #90ee90;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .menu-title { font-size: 32px; }
            .menu-btn { min-width: 200px; padding: 12px 30px; font-size: 18px; }
            .upgrade-card { width: 180px; padding: 15px; }
            .hud { font-size: 14px; }
            .compass { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-overlay">
        <div class="hud" id="hud">
            <div>🍎 Еда: <span id="scoreDisplay">0</span></div>
            <div>⭐ Уровень: <span id="levelDisplay">1</span></div>
            <div>💚 Здоровье: <span id="healthDisplay">100</span>%</div>
        </div>
        
        <div class="compass" id="compass">
            <div class="compass-arrow" id="compassArrow"></div>
            <div class="compass-center"></div>
        </div>
    </div>

    <div class="menu-screen" id="mainMenu">
        <div class="menu-title">🐉 Snake Survival</div>
        <div class="menu-subtitle">Фэнтези Приключение</div>
        <div class="stats-row" id="bestStats">
            <div class="stat-item">
                <div class="stat-label">Лучший счёт</div>
                <div id="bestScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Макс уровень</div>
                <div id="maxLevel">1</div>
            </div>
        </div>
        <button class="menu-btn" onclick="startGame()">🎮 Начать игру</button>
        <button class="menu-btn" onclick="showControls()">❓ Управление</button>
    </div>

    <div class="menu-screen pause-menu" id="pauseMenu">
        <div class="menu-title">⏸️ Пауза</div>
        <button class="menu-btn" onclick="resumeGame()">▶️ Продолжить</button>
        <button class="menu-btn" onclick="quitToMenu()">🏠 В меню</button>
    </div>

    <div class="upgrade-screen" id="upgradeScreen">
        <div class="upgrade-title">✨ Выберите улучшение!</div>
        <div class="upgrade-cards" id="upgradeCards"></div>
    </div>

    <div class="menu-screen" id="gameOverScreen" style="display: none;">
        <div class="menu-title">💀 Игра окончена</div>
        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-label">Счёт</div>
                <div id="finalScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Уровень</div>
                <div id="finalLevel">1</div>
            </div>
        </div>
        <button class="menu-btn" onclick="startGame()">🔄 Играть снова</button>
        <button class="menu-btn" onclick="quitToMenu()">🏠 В меню</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
