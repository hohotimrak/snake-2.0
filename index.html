<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Survival: Neon Arena</title>
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.3), 
                        0 0 100px rgba(138, 43, 226, 0.2);
            background: rgba(10, 10, 30, 0.95);
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .score-panel {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .score-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .level-indicator {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: right;
        }

        .level-bar {
            width: 150px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .level-progress {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
        }

        .menu-title {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 10px;
            text-align: center;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .menu-subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
            text-align: center;
        }

        .menu-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 18px 60px;
            font-size: 20px;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .upgrade-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 100px rgba(0, 255, 255, 0.2);
            pointer-events: auto;
            z-index: 200;
            display: none;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
        }

        .upgrade-title {
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upgrade-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .upgrade-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .upgrade-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00ffff;
            transform: translateY(-5px);
        }

        .upgrade-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .upgrade-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .upgrade-desc {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        .rarity-common { border-color: #888; }
        .rarity-rare { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .rarity-epic { border-color: #ff00ff; box-shadow: 0 0 20px rgba(255, 0, 255, 0.3); }
        .rarity-legendary { 
            border-color: #ffd700; 
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: legendaryGlow 2s ease infinite;
        }

        @keyframes legendaryGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
        }

        .pause-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .stats-panel {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 300px;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 768px) {
            .menu-title { font-size: 32px; }
            .score-value { font-size: 22px; }
            .upgrade-cards { grid-template-columns: 1fr; }
            .controls-hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay" id="uiOverlay" style="display: none;">
            <div class="hud-top">
                <div class="score-panel">
                    <div class="score-label">Счёт</div>
                    <div class="score-value" id="scoreValue">0</div>
                </div>
                <div class="level-indicator">
                    <div class="score-label">Уровень <span id="levelValue">1</span></div>
                    <div class="level-bar">
                        <div class="level-progress" id="levelProgress" style="width: 0%"></div>
                    </div>
                </div>
                <button class="pause-btn" id="pauseBtn">⏸️ Пауза</button>
            </div>
            <div class="controls-hint" id="controlsHint">
                WASD / Стрелки / Свайп для управления
            </div>
        </div>

        <div class="menu-screen" id="mainMenu">
            <div class="menu-title">🐍 SNAKE SURVIVAL</div>
            <div class="menu-subtitle">Neon Arena Edition</div>
            <button class="menu-btn" id="startBtn">Играть</button>
            <button class="menu-btn" id="statsBtn">Статистика</button>
        </div>

        <div class="menu-screen" id="statsMenu" style="display: none;">
            <div class="menu-title">📊 СТАТИСТИКА</div>
            <div class="stats-panel" id="statsPanel">
                <div class="stat-row">
                    <span>Лучший счёт:</span>
                    <span id="bestScore">0</span>
                </div>
                <div class="stat-row">
                    <span>Всего игр:</span>
                    <span id="totalGames">0</span>
                </div>
                <div class="stat-row">
                    <span>Всего съедено:</span>
                    <span id="totalFood">0</span>
                </div>
                <div class="stat-row">
                    <span>Максимальный уровень:</span>
                    <span id="maxLevel">1</span>
                </div>
            </div>
            <button class="menu-btn" id="backBtn" style="margin-top: 30px;">Назад</button>
        </div>

        <div class="menu-screen" id="gameOverMenu" style="display: none;">
            <div class="menu-title">💀 GAME OVER</div>
            <div class="stats-panel">
                <div class="stat-row">
                    <span>Счёт:</span>
                    <span id="finalScore">0</span>
                </div>
                <div class="stat-row">
                    <span>Уровень:</span>
                    <span id="finalLevel">1</span>
                </div>
                <div class="stat-row">
                    <span>Рекорд:</span>
                    <span id="newRecord">Нет</span>
                </div>
            </div>
            <button class="menu-btn" id="restartBtn" style="margin-top: 30px;">Играть снова</button>
            <button class="menu-btn" id="menuBtn">В меню</button>
        </div>

        <div class="upgrade-panel" id="upgradePanel">
            <div class="upgrade-title">⬆️ ВЫБЕРИ УЛУЧШЕНИЕ</div>
            <div class="upgrade-cards" id="upgradeCards"></div>
        </div>

        <div class="menu-screen" id="pauseMenu" style="display: none;">
            <div class="menu-title">⏸️ ПАУЗА</div>
            <button class="menu-btn" id="resumeBtn">Продолжить</button>
            <button class="menu-btn" id="quitBtn">В меню</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
